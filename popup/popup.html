<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoho Batch Auto-Assign</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">⚡</div>
      <div class="header-text">
        <h1>Batch Auto-Assign</h1>
        <p>Zoho Inventory</p>
      </div>
    </div>

    <div class="how-to">
      <h2>How to use</h2>
      <ol>
        <li>Create an invoice in Zoho Inventory, or click <strong>Edit</strong> on a saved one</li>
        <li>Click <strong>⚡ Auto-Assign Batches (FIFO)</strong> at the bottom-right</li>
        <li>Review the plan, then click <strong>Fill these batches</strong></li>
        <li>Check the batches, then click Save as usual</li>
      </ol>
    </div>
  </div>

</body>
</html>
